<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div style="font-family: 'Times New Roman', 'Times', serif; font-size: 14pt; line-height: 1.5;">
    <p>vCOC kính gửi đồng chí,</p>
    <p>Đến thời điểm <strong th:text="${hour}"></strong> giờ <strong th:text="${minute}"></strong> phút ngày <strong th:text="${date}"></strong>:</p>
    <table border="1" cellpadding="5" cellspacing="0" style="border-collapse: collapse; width: 100%; max-width: 800px;">
        <tr style="background-color: #f2f2f2; text-align: center; font-weight: bold;">
            <th>STT</th>
            <th>Chỉ số</th>
            <th>Lũy kế</th>
            <th>Cảnh báo</th>
            <th>KPI</th>
            <th>Mức cảnh báo</th>
        </tr>
        <tr th:each="v, stat : ${violations}" style="text-align: center;">
            <td th:text="${stat.count}"></td>
            <td style="text-align: left;" th:text="${v.name}"></td>
            <td style="color: red; font-weight: bold;" th:text="${v.actualValue + '%'}"></td>
            <td th:text="${v.deviationDirection + ' ' + v.deviationValue + '%'}"></td>
            <td th:text="${v.targetKpiValue + '%'}"></td>
            <td style="font-weight: bold;" th:text="${'Mức ' + v.level}"></td>
        </tr>
    </table>
    <p>Trân trọng,<br/>
        <strong>Hệ thống Điều hành Trung tâm (vCOC)</strong></p>
</div>
</body>
</html>
